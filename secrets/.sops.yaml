# sops-nix 加密规则模板
# 1. 在目标机器上取得主机 Age 公钥：
#      nix run nixpkgs#ssh-to-age -- -i /etc/ssh/ssh_host_ed25519_key.pub
#    （depin 为 /var/lib/echoforge/ssh/ssh_host_ed25519_key.pub）
# 2. 把公钥填到下面 age 列表，然后：
#      sops secrets/secrets.yaml
# 3. 加密后的 secrets.yaml 可以安全入库；明文永不落盘、永不出现在 Nix store。
#    解密挂载点固定为 /run/secrets/<key>。
keys:
  - &host_desktop age1REPLACE_WITH_HOST_PUBLIC_KEY
creation_rules:
  - path_regex: secrets/secrets\.yaml$
    key_groups:
      - age:
          - *host_desktop
